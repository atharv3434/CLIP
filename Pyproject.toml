[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-search"
version = "0.1.0"
description = "Multimodal visual search prototype: find catalog items by uploading a photo or typing a description"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "faiss-cpu>=1.7.4",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
clip = [
    "torch>=2.1.0",
    "open_clip_torch>=2.24.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
visual-search = "visual_search.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]